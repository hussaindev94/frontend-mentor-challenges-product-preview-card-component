<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <!-- Load the font files here -->
    <link rel="preload" as="font" type="font/otf" href="assets/fonts/Fraunces-Bold.otf" crossorigin>
    <link rel="preload" as="font" type="font/otf" href="assets/fonts/Montserrat-Bold.otf" crossorigin>
    <link rel="preload" as="font" type="font/otf" href="assets/fonts/Montserrat-Medium.otf" crossorigin>

  <!-- CSS Files -->
   <!-- Font files will be ontop to be ready to used in other files -->
    <link rel="stylesheet" href="styles/fonts.css">
   <!-- First load the rest file -->
   <link rel="stylesheet" href="styles/reset.css">
   <!-- Second load the main styles -->
    <link rel="stylesheet" href="styles/main.css">
    <!-- Therd conainer queries if used any -->
     <link rel="stylesheet" href="styles/containerquery.css">
    <!-- Fourth the media queries if the device is not mobile -->
      <link rel="stylesheet" href="styles/mediaquery.css">

  <title>Frontend Mentor | Product preview card component</title>

</head>
<body>
  <!-- main -->
  <main class="main">
    <!-- card-wrapper -->
    <section class="card-wrapper" aria-labelledby="Gabrielle Essence Eau De Parfum">
      <div class="card-image-wrapper">

      </div>
      <!-- card-content -->
       <article class="card-content">
        <!-- card info container -->
         <div class="card-info-container">
           <p class="item-category-name">
             PERFUME
          </p>
          <h1 class="item-name">
            Gabrielle Essence Eau De Parfum
          </h1>
          <p class="item-description">
            A floral, solar and voluptuous interpretation composed by Olivier Polge,
            Perfumer-Creator for the House of CHANEL.
          </p>
        </div>
        <!-- price -->
        <div class="price-content">
          <p class="current-price">$149.99</p>
          <del class="last-price">$169.99</del>
        </div>
        <!-- button -->
        <button class="purchase-button" type="button" aria-label="Add to Cart">
          <img class="button-icon" src="./images/icon-cart.svg" alt="" aria-hidden="true" width="32" height="32" loading="lazy">
          Add to Cart
        </button>
       </article>
    </section>
  </main>

  <footer class="footer" id="footer">
    <div class="attribution">
      <ul>
        <li>
          Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener noreferrer">Frontend Mentor</a>.
        </li>
        <li>
          Coded by <a href="https://www.frontendmentor.io/profile/hussaindev94" target="_blank" rel="noopener noreferrer">Hussain Al-shaer</a>.
        </li>
          </ul>
    </div>
  </footer>
</body>
</html>
